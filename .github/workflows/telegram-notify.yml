name: Telegram Notifications

on:
  workflow_dispatch:
  watch:
    types: [started]
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, reopened]
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")
          event_name = os.environ.get("EVENT_NAME")
          actor = os.environ.get("ACTOR")
          repo = os.environ.get("REPO")
          event_path = os.environ.get("EVENT_PATH")

          if not token or not chat_id:
              print("Missing Telegram secrets")
              exit(0)

          payload = {}
          if event_path and os.path.exists(event_path):
              with open(event_path, "r", encoding="utf-8") as f:
                  payload = json.load(f)

          action = payload.get("action", "")

          if event_name == "watch":
              text = (
                  f"⭐ *¡Nueva estrella en RBTray-rs!*\n\n"
                  f"• *Usuario:* [{actor}](https://github.com/{actor})\n"
                  f"• *Repositorio:* [{repo}](https://github.com/{repo})"
              )
          elif event_name == "issues":
              issue = payload.get("issue", {})
              title = issue.get("title", "")
              num = issue.get("number", "")
              url = issue.get("html_url", "")
              text = (
                  f"🐛 *Issue ({action}) en RBTray-rs*\n\n"
                  f"• *Título:* #{num} {title}\n"
                  f"• *Autor:* [{actor}](https://github.com/{actor})\n"
                  f"• *Enlace:* [Ver Issue]({url})"
              )
          elif event_name == "issue_comment":
              issue = payload.get("issue", {})
              title = issue.get("title", "")
              comment = payload.get("comment", {})
              url = comment.get("html_url", "")
              text = (
                  f"💬 *Nuevo comentario en RBTray-rs*\n\n"
                  f"• *En:* {title}\n"
                  f"• *Por:* [{actor}](https://github.com/{actor})\n"
                  f"• *Enlace:* [Ver comentario]({url})"
              )
          elif event_name == "pull_request":
              pr = payload.get("pull_request", {})
              title = pr.get("title", "")
              num = pr.get("number", "")
              url = pr.get("html_url", "")
              text = (
                  f"🔀 *Pull Request ({action}) en RBTray-rs*\n\n"
                  f"• *Título:* #{num} {title}\n"
                  f"• *Autor:* [{actor}](https://github.com/{actor})\n"
                  f"• *Enlace:* [Ver PR]({url})"
              )
          elif event_name == "release":
              rel = payload.get("release", {})
              tag = rel.get("tag_name", "")
              name = rel.get("name", "")
              url = rel.get("html_url", "")
              text = (
                  f"🚀 *Release ({action}) en RBTray-rs*\n\n"
                  f"• *Versión:* {tag} - {name}\n"
                  f"• *Enlace:* [Ver Release]({url})"
              )
          elif event_name == "workflow_dispatch":
              text = (
                  f"🔔 *Prueba de Notificación Telegram*\n\n"
                  f"• *Repositorio:* [{repo}](https://github.com/{repo})\n"
                  f"• *Disparado por:* [{actor}](https://github.com/{actor})\n"
                  f"• *Estado:* ¡El bot está activo y conectado al 100%!"
              )
          else:
              text = f"🔔 *Notificación de GitHub:* {event_name} ({action}) por [{actor}](https://github.com/{actor})"

          body = json.dumps({
              "chat_id": chat_id,
              "text": text,
              "parse_mode": "Markdown",
              "disable_web_page_preview": True
          }).encode("utf-8")

          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=body,
              headers={"Content-Type": "application/json"}
          )
          with urllib.request.urlopen(req) as resp:
              print("Notificación enviada con éxito:", resp.status)
          EOF
