[package]
name = "rbhook"
version = "0.2.0"
edition = "2021"
description = "Global injection hook DLL for RBTray-rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }
